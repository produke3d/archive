name: Batch Process Crosshairs

on:
  workflow_dispatch:
  push:
    paths:
      - "crosshairs/**"

jobs:

  batch-process-crosshairs:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    
      - name: Check out public archive repository
        uses: actions/checkout@v4

      - name: Check out private scripts repository
        uses: actions/checkout@v4
        with:
          repository: produke3d/scripts
          ref: master
          token: ${{ secrets.SCRIPTS_REPOSITORY_TOKEN }}
          path: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run processing script
        run: node scripts/batch-process-crosshairs.js

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: produke3d/website
          token: ${{ secrets.WEBSITE_REPOSITORY_TOKEN }}
          path: website

      - name: Push crosshairs.json.gz to website
        run: |
          mkdir -p website/res/databases
          cp crosshairs.json.gz website/res/databases/crosshairs.json.gz
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add res/databases/crosshairs.json.gz
          if git diff --cached --quiet; then
            echo "crosshairs.json.gz is unchanged; nothing to push."
            exit 0
          fi
          git commit -m "Update crosshairs database"
          git push