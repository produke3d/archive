name: Batch Process Demos

on:
  workflow_dispatch:
  push:
    paths:
      - "demos/**"

jobs:

  batch-process-demos:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Check out public archives repository
        uses: actions/checkout@v4

      - name: Check out private scripts repository
        uses: actions/checkout@v4
        with:
          repository: produke3d/scripts
          ref: master
          token: ${{ secrets.SCRIPTS_REPOSITORY_TOKEN }}
          path: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run processing script
        run: node scripts/batch-process-demos.js

      - name: Commit changes
        run: |
          git add -A -- demos/
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Batch Process Demos"
            git push
          fi

      - name: Upload demos.json.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload archive-database-files demos.json.gz --clobber